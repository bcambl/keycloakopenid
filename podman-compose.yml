services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command:
      - start-dev
      - --http-host=0.0.0.0
      - --http-port=8081
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: demo-admin-password
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    security_opt:
      - label=disable

  traefik:
    image: traefik:v3.3.3
    command:
      - --configFile=/etc/traefik/traefik.yml
    network_mode: host
    volumes:
      - .:/plugins-local/src/github.com/bcambl/keycloakopenid:ro
      - ./dev/traefik:/etc/traefik:ro
    security_opt:
      - label=disable
    depends_on:
      - keycloak

  helloworld1:
    build:
      context: ./dev/helloworld
      dockerfile: Containerfile
    environment:
      APP_NAME: helloworld1
      OTHER_APP_URL: http://helloworld2.localhost:8000
    ports:
      - "127.0.0.1:9001:8080"

  helloworld2:
    build:
      context: ./dev/helloworld
      dockerfile: Containerfile
    environment:
      APP_NAME: helloworld2
      OTHER_APP_URL: http://helloworld1.localhost:8000
    ports:
      - "127.0.0.1:9002:8080"
