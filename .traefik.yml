# The name of your plugin as displayed in the Plugins Catalog web UI.
displayName: keycloakopenid

# For now, `middleware` is the only type available.
type: middleware

# The import path of your plugin.
import: github.com/bcambl/keycloakopenid

# A brief description of what your plugin is doing.
summary: This plugin for Traefik authenticates requests against Keycloak using the OpenID Connect authorization-code flow with S256 PKCE. It validates the ID token, stores sessions in a bounded in-memory LRU store, and issues a host-only session cookie. It forwards the authenticated user in a configurable header and can optionally forward the bearer token in the Authorization header.

# Medias associated to the plugin (optional)
iconPath: foo/icon.png
bannerPath: foo/banner.png

# Configuration data for your plugin.
# This is mandatory,
# and Plugins Catalog will try to execute the plugin with the data you provide as part of its startup validity tests.
testData:
  KeycloakURL: "my-keycloak-url.com"
  ClientID: "<CLIENT_ID"
  ClientSecret: "<CLIENT_SECRET"
  KeycloakRealm: "<REALM"
  Scope: "openid"
  CallbackURL: "https://app.example.com/callback"
  UseAuthHeader: false
